<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:0.75rem;">
  {% for n in notes %}
  <div class="card" id="note-{{ n.id }}">
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <strong>{{ n.title }}</strong>
      <button class="icon-btn danger" title="Usuń"
              hx-delete="/resources/notes/{{ n.id }}" hx-confirm="Usunąć notatkę?"
              hx-target="#note-{{ n.id }}" hx-swap="outerHTML">🗑</button>
    </div>
    <div class="subtle" style="font-size:0.75rem; margin-bottom:0.4rem;">{{ n.updated_at[:10] }}</div>
    <p class="muted" style="white-space:pre-wrap; margin:0;">{{ n.content }}</p>
  </div>
  {% else %}
  <p class="muted">Brak notatek.</p>
  {% endfor %}
</div>
