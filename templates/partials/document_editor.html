<div id="editor-area" class="docs-editor">
  {% if saved is defined and saved %}
  <span class="chip status-ok docs-saved-chip">Zapisano ✓</span>
  {% endif %}
  <form hx-put="/documents/{{ doc.id }}" hx-target="#editor-area" hx-swap="outerHTML"
        style="display:flex; flex-direction:column; flex:1; min-height:0; gap:0.5rem;">

    <!-- Pasek narzędzi -->
    <div class="docs-editor-bar">
      <input id="doc-title" type="text" name="title" value="{{ doc.title }}" placeholder="Tytuł dokumentu">
      <button type="submit" class="btn btn-primary">Zapisz</button>
      <button type="button" class="btn btn-ghost docs-delete-btn"
              hx-delete="/documents/{{ doc.id }}" hx-confirm="Usunąć dokument?">Usuń</button>
    </div>

    <!-- Edytor Markdown -->
    <textarea id="doc-content" name="content" class="docs-editor-textarea"
              placeholder="Treść dokumentu (Markdown)...">{{ doc.content }}</textarea>
  </form>
</div>
