<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:0.75rem;">
  {% for l in links %}
  <div class="card" id="link-{{ l.id }}">
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <div>
        <strong><a href="{{ l.url }}" target="_blank" rel="noopener">{{ l.title }}</a></strong>
        {% if l.category %}<span class="chip" style="margin-left:0.4rem;">{{ l.category }}</span>{% endif %}
        <div class="subtle" style="font-size:0.8rem;">{{ l.url }}</div>
        {% if l.note %}<p class="muted" style="margin:0.4rem 0 0;">{{ l.note }}</p>{% endif %}
      </div>
      <button class="icon-btn danger" title="Usuń"
              hx-delete="/resources/links/{{ l.id }}" hx-confirm="Usunąć link?"
              hx-target="#link-{{ l.id }}" hx-swap="outerHTML">🗑</button>
    </div>
  </div>
  {% else %}
  <p class="muted">Brak zapisanych linków.</p>
  {% endfor %}
</div>
